# Supabase project configuration
# Cron job scheduling is handled via pg_cron migrations (zie 20260615100000_cron_jobs.sql)
# Zodra de CLI `schedule` ondersteunt (>=v2.106.0), kan dit hier worden geconfigureerd:
#
# [functions.check-herinneringen]
# schedule = "0 8 * * *"
#
# [functions.moneybird-sync-btw]
# schedule = "0 6 * * *"

# AFAS staat geparkeerd; afas-test was een open endpoint (verify_jwt=false) dat
# als proxy/SSRF naar AFAS misbruikt kon worden. Dichtgezet: alleen ingelogde
# gebruikers mogen het testendpoint aanroepen.
[functions.afas-test]
verify_jwt = true

# Stripe roept de webhook publiek aan (geen Supabase-JWT). De echtheid wordt
# geverifieerd via de Stripe-signature (STRIPE_WEBHOOK_SECRET) in de functie zelf.
[functions.stripe-webhook]
verify_jwt = false

# Publieke betaal-tussenpagina (/betaal/<token>): de klant is niet ingelogd. De
# autorisatie zit in het onraadbare token; de functie leest server-side.
[functions.stripe-pay-link]
verify_jwt = false

# Google redirect de browser terug zonder Supabase-JWT, dus deze callback moet
# publiek zijn. De echtheid wordt geverifieerd via een HMAC-ondertekend `state`-
# token (10 min geldig) in de functie zelf.
[functions.google-calendar-callback]
verify_jwt = false

# SnelStart POST de koppelsleutel-webhook publiek aan (geen Supabase-JWT, geen
# signature). De echtheid wordt geverifieerd via het geheime ?key=-token
# (SNELSTART_WEBHOOK_SECRET) in de functie zelf; zonder die secret weigert de
# functie alles (503) — pas actief na certificering.
[functions.snelstart-webhook]
verify_jwt = false

# Stripe Billing (abonnementen aan BossBase, op ons eigen platform-account).
# Stripe roept dit publiek aan zonder Supabase-JWT; de echtheid komt uit de
# signature met STRIPE_BILLING_WEBHOOK_SECRET — een ANDERE secret dan die van
# de Connect-webhook hierboven, zodat de twee integraties elkaar niet kunnen
# beïnvloeden.
[functions.billing-webhook]
verify_jwt = false
